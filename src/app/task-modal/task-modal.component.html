<div class="modal-header">
  <h5 class="modal-title">{{ task?.id ? 'Update Task' : 'Add New Task' }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close()"></button>
</div>
<div class="modal-body">
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="project">Project:</label>
      <select id="project" class="form-control" [(ngModel)]="task.projectId" name="projectId" required>
        <option *ngFor="let project of masterProjects" [value]="project.id">{{ project.name }}</option>
      </select>
    </div>
    <div class="form-group">
      <label for="activity">Activity:</label>
      <select id="activity" class="form-control" [(ngModel)]="task.activityId" name="activityId" required>
        <option *ngFor="let activity of masterActivities" [value]="activity.id">{{ activity.name }}</option>
      </select>
    </div>
    <div class="form-group">
      <label for="starttime">Planned Start Date:</label>
      <input type="datetime-local" id="starttime" class="form-control" [(ngModel)]="task.starttime" name="starttime" required>
    </div>
    <div class="form-group">
      <label for="endtime">Planned End Date:</label>
      <input type="datetime-local" id="endtime" class="form-control" [(ngModel)]="task.endtime" name="endtime" required>
    </div>
    <div class="form-group">
      <label for="status">Status:</label>
      <input type="text" id="status" class="form-control" [(ngModel)]="task.status" name="status" required>
    </div>
    <div class="form-group">
      <label for="priority">Priority:</label>
      <input type="number" id="priority" class="form-control" [(ngModel)]="task.priority" name="priority" required>
    </div>
    <div class="form-group">
      <label for="remarks">Remarks:</label>
      <input type="text" id="remarks" class="form-control" [(ngModel)]="task.remarks" name="remarks">
    </div>
    <div class="form-group">
      <label for="important">Important:</label>
      <input type="checkbox" id="important" class="form-check-input" [(ngModel)]="task.important" name="important">
    </div>
    <button type="submit" class="btn btn-primary">{{ task?.id ? 'Update Task' : 'Add Task' }}</button>
  </form>
</div>
